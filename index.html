<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101522"><title>DRAFT LAB 0.2</title><style>:root{font-family:system-ui,Arial;background:#101522;color:#e9eef9}*{box-sizing:border-box}body{margin:0;padding:16px 14px 60px;max-width:850px;margin:auto}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:27px;margin:8px 0}small,.muted{color:#9baac2}.pill{border:1px solid #35795f;border-radius:30px;padding:8px;color:#78e2b0;font-size:12px}.teams{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:18px 0}.panel,.card{background:#1b2435;border:1px solid #35415a;border-radius:15px;padding:12px}.panel h3{font-size:13px;margin:0 0 10px}.ally{color:#66d7a0}.enemy{color:#ff8997}.chip{display:flex;align-items:center;justify-content:space-between;background:#283348;border-radius:8px;padding:7px;margin:5px 0;font-size:12px;gap:4px}.chip button{border:0;background:none;color:#ddd;font-size:19px}.switch{display:grid;grid-template-columns:1fr 1fr;gap:8px}.switch button,button.action{background:#29364b;border:1px solid #52637e;color:white;padding:12px;border-radius:11px;font-weight:650}.switch .active{background:#35547e;border-color:#84b6fa}input{width:100%;margin:12px 0;background:#1b2435;color:white;border:1px solid #43536f;border-radius:11px;padding:15px;font-size:16px}.heroes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;max-height:235px;overflow:auto}.hero{background:#263349;border:1px solid #3d4d67;color:white;border-radius:10px;padding:5px;display:flex;align-items:center;gap:6px;min-height:47px;font-size:11px;text-align:left}.hero img,.portrait{width:38px;height:31px;object-fit:cover;border-radius:5px;background:#36455b}.hero span{overflow:hidden;text-overflow:ellipsis}.top{display:flex;align-items:center;justify-content:space-between;margin:20px 0 10px}.top h2{margin:0}.card{margin:9px 0}.result{display:flex;gap:12px;align-items:center}.result img{width:68px;height:44px;object-fit:cover;border-radius:7px}.score{margin-left:auto;font-weight:800;color:#73dbad;font-size:21px}.reason{font-size:13px;color:#aabbd0;margin-top:8px}.bar{height:5px;background:#35415a;border-radius:9px;margin-top:10px}.bar>div{height:100%;background:#6db3f6;border-radius:9px}.status{font-size:12px;color:#9bb2d3;padding:9px 0}.warning{color:#ffc782}details{margin-top:9px;color:#b9c9e0;font-size:12px}summary{cursor:pointer}.footer{margin-top:18px;color:#9daec6;font-size:12px;line-height:1.5}button{cursor:pointer}button:disabled{opacity:.4}</style></head><body><header><h1>DRAFT LAB</h1><span class="pill">⚡ LIVE DRAFT 0.2</span></header><small>POS 1 · Подбор керри · OpenDota</small><div class="teams"><section class="panel"><h3 class="ally">СОЮЗНИКИ <span id="ac"></span></h3><div id="allies"></div></section><section class="panel"><h3 class="enemy">ПРОТИВНИКИ <span id="ec"></span></h3><div id="enemies"></div></section></div><div class="switch"><button id="enemyBtn" class="active">+ Противник</button><button id="allyBtn">+ Союзник</button></div><input id="search" placeholder="🔎 Найти героя..." autocomplete="off"><div class="heroes" id="heroes"></div><div class="top"><h2>Лучшие пики</h2><button class="action" id="reset">↻ Сброс</button></div><div id="status" class="status"></div><div id="results"></div><button class="action" id="refresh" style="width:100%;margin-top:12px">↻ Обновить статистику</button><div class="footer">Статистика матчапов OpenDota — агрегированные игры, не гарантированно текущий патч и не только позиция 1. Рейтинг — эвристика, не вероятность победы. При отсутствии данных приложение не выдумывает цифры.</div><script>
const API='https://api.opendota.com/api',CDN='https://cdn.cloudflare.steamstatic.com';
const $=id=>document.getElementById(id);const store=(k,v)=>localStorage.setItem(k,JSON.stringify(v));const load=(k,f)=>{try{return JSON.parse(localStorage.getItem(k))??f}catch{return f}};
let heroes=load('dl02heroes',[]),stats=load('dl02stats',[]),matchups=load('dl02matchups',{}),updated=load('dl02updated',null),allies=load('dl02allies',[]),enemies=load('dl02enemies',[]),side='enemy',query='',busy=false;
const image=h=>h?.img?CDN+h.img:'';const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const heroName=id=>heroes.find(h=>h.id===id)?.localized_name||`#${id}`;
function renderTeams(){for(const [key,ids,limit] of [['allies',allies,4],['enemies',enemies,5]]){$(key).innerHTML=ids.map(id=>`<div class="chip"><span>${escapeHtml(heroName(id))}</span><button data-remove="${key}:${id}" aria-label="Удалить">×</button></div>`).join('');$(key==='allies'?'ac':'ec').textContent=`${ids.length}/${limit}`;}document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{const [key,id]=b.dataset.remove.split(':');if(key==='allies')allies=allies.filter(x=>x!==+id);else enemies=enemies.filter(x=>x!==+id);saveDraft();render()})}
function renderHeroes(){const used=new Set([...allies,...enemies]);$('heroes').innerHTML=heroes.filter(h=>!used.has(h.id)&&h.localized_name.toLowerCase().includes(query.toLowerCase())).map(h=>`<button class="hero" data-id="${h.id}">${image(h)?`<img loading="lazy" src="${image(h)}" alt="">`:''}<span>${escapeHtml(h.localized_name)}</span></button>`).join('');document.querySelectorAll('.hero').forEach(b=>b.onclick=()=>{const id=+b.dataset.id;if(side==='enemy'&&enemies.length<5)enemies.push(id);if(side==='ally'&&allies.length<4)allies.push(id);saveDraft();$('search').value='';query='';render()})}
function saveDraft(){store('dl02allies',allies);store('dl02enemies',enemies)}
function getBaseline(h){const s=stats.find(x=>x.id===h.id);if(!s)return null;let wins=0,picks=0;for(let i=1;i<=8;i++){wins+=Number(s[`${i}_win`]||0);picks+=Number(s[`${i}_pick`]||0)}return picks>0?{wr:wins/picks,n:picks}:null}
function scoreHero(h){const rows=matchups[h.id];if(!rows||!enemies.length)return null;const map=new Map(rows.map(r=>[r.hero_id,r]));const samples=enemies.map(id=>{const r=map.get(id);if(!r||r.games_played<30)return null;const n=r.games_played,raw=r.wins/n,prior=getBaseline(h)?.wr??.5,shrunk=(r.wins+prior*200)/(n+200);return{id,n,wr:shrunk,raw}});if(samples.some(x=>!x))return null;const base=getBaseline(h);const matchup=samples.reduce((s,x)=>s+x.wr,0)/samples.length;const rating=matchup*.8+(base?.wr??.5)*.2;const minN=Math.min(...samples.map(x=>x.n));return{h,rating,matchup,base,samples,minN}}
function renderResults(){const candidates=heroes.filter(h=>h.roles?.includes('Carry')&&!allies.includes(h.id)&&!enemies.includes(h.id));const scored=candidates.map(scoreHero).filter(Boolean).sort((a,b)=>b.rating-a.rating);const loaded=candidates.filter(h=>matchups[h.id]).length;let status=`Данные матчапов: ${loaded}/${candidates.length} керри`;if(updated)status+=` · Обновлено: ${new Date(updated).toLocaleString('ru-RU')}`;if(busy)status+=' · Загрузка…';$('status').textContent=status;
if(!enemies.length){$('results').innerHTML='<div class="card warning">Добавь хотя бы одного противника для расчёта. Без вражеских пиков нет оснований ранжировать контрпики.</div>';return}
if(!scored.length){$('results').innerHTML='<div class="card warning">Недостаточно данных для рекомендаций. Нажми «Обновить статистику». Для каждого выбранного противника нужно не менее 30 игр матчапа.</div>';return}
$('results').innerHTML=scored.slice(0,3).map((r,i)=>{const confidence=r.minN>=1000?'Выше':r.minN>=200?'Средняя':'Низкая';const sorted=[...r.samples].sort((a,b)=>b.wr-a.wr);return `<article class="card"><div class="result">${image(r.h)?`<img src="${image(r.h)}" alt="">`:''}<div><div style="color:#93a7c4;font-size:11px">#${i+1} · ${confidence} уверенность</div><strong>${escapeHtml(r.h.localized_name)}</strong></div><div class="score">${(r.rating*100).toFixed(1)}</div></div><div class="bar"><div style="width:${Math.max(0,Math.min(100,r.rating*100))}%"></div></div><div class="reason">Против ${escapeHtml(heroName(sorted[0].id))}: ${(sorted[0].wr*100).toFixed(1)}% (сглажено) · ${sorted[0].n.toLocaleString('ru-RU')} игр</div><details><summary>Матчапы и методика</summary>${r.samples.map(s=>`<p>${escapeHtml(heroName(s.id))}: ${(s.wr*100).toFixed(1)}% · ${s.n} игр</p>`).join('')}<p>Рейтинг = 80% средний сглаженный винрейт против известных врагов + 20% общий винрейт. Синергия с союзниками пока не учитывается. Это не прогноз победы.</p></details></article>`}).join('');if(loaded<candidates.length)$('results').insertAdjacentHTML('beforeend','<p class="status warning">Часть керри не проверена: рейтинг предварительный, пока загрузка не завершена.</p>')}
function render(){renderTeams();renderHeroes();renderResults()}
async function getJson(url){const c=new AbortController(),timer=setTimeout(()=>c.abort(),12000);try{const r=await fetch(url,{signal:c.signal});if(!r.ok)throw Error('HTTP '+r.status);return await r.json()}finally{clearTimeout(timer)}}
async function refresh(){if(busy)return;busy=true;renderResults();let failures=0;try{const [hs,ss]=await Promise.all([getJson(API+'/heroStats'),getJson(API+'/heroStats')]);if(!Array.isArray(hs)||!hs.length)throw Error('Нет списка героев');heroes=hs.map(h=>({id:h.id,localized_name:h.localized_name,roles:h.roles,img:h.img})).sort((a,b)=>a.localized_name.localeCompare(b.localized_name));stats=ss;store('dl02heroes',heroes);store('dl02stats',stats);render();const candidates=heroes.filter(h=>h.roles?.includes('Carry'));for(const h of candidates){try{const data=await getJson(API+`/heroes/${h.id}/matchups`);if(!Array.isArray(data))throw Error('Неверный ответ');matchups[h.id]=data;store('dl02matchups',matchups)}catch(e){failures++}renderResults();await new Promise(r=>setTimeout(r,180))}updated=Date.now();store('dl02updated',updated);$('status').textContent=failures?`Обновление завершено с ошибками: ${failures}`:'Обновление завершено';}catch(e){$('status').textContent='Не удалось обновить данные: '+e.message+'. Проверь интернет или ограничения API.'}finally{busy=false;render()}}
$('enemyBtn').onclick=()=>{side='enemy';$('enemyBtn').classList.add('active');$('allyBtn').classList.remove('active')};$('allyBtn').onclick=()=>{side='ally';$('allyBtn').classList.add('active');$('enemyBtn').classList.remove('active')};$('search').oninput=e=>{query=e.target.value;renderHeroes()};$('reset').onclick=()=>{allies=[];enemies=[];saveDraft();render()};$('refresh').onclick=refresh;
render();if(!heroes.length)refresh();if('serviceWorker' in navigator)navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister())).catch(()=>{});

</script></body></html>
